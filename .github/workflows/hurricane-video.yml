# Video automático de ciclones para Facebook (Qué Pasa Vallarta).
#
# Después de cada boletín completo del Centro Nacional de Huracanes
# (03, 09, 15 y 21 UTC = 9 p.m., 3 a.m., 9 a.m. y 3 p.m. hora centro):
#  1. Revisa los ciclones activos del Pacífico Este (nhc.noaa.gov).
#  2. Si alguno amenaza a Puerto Vallarta / Bahía de Banderas y ese boletín
#     no tiene video todavía, genera el video con los datos oficiales.
#  3. Lo sube a WordPress (quepasavta.com) y lo publica como reel en Facebook.
#
# Desde 2026-10-27 el sitio es WordPress en HostGator: usa los secretos del robot
# (WP_URL, WP_USER, WP_APP_PASSWORD, FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN, GEMINI_API_KEY).
# Para pausar: scripts/hurricane-video/config.json → "publish": false.
name: Video de ciclón

on:
  schedule:
    # GitHub a veces retrasa o salta corridas: revisamos cada 20 min y
    # solo se genera video cuando hay un boletín nuevo sin publicar.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Generar aunque el ciclón esté lejos (prueba)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hurricane-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://quepasavta.com
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Publicación activada?
        id: cfg
        run: |
          echo "publish=$(python3 -c "import json;print(str(json.load(open('scripts/hurricane-video/config.json'))['publish']).lower())")" >> "$GITHUB_OUTPUT"

      - name: Revisar ciclones activos
        id: check
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, "scripts/hurricane-video")
          import nhc, base64, urllib.error
          def wp_existe(key):
              # Registro del video en WordPress (almacén del robot). 404 = todavía no hay video.
              auth = base64.b64encode(f"{os.environ['WP_USER']}:{os.environ['WP_APP_PASSWORD'].replace(' ', '')}".encode()).decode()
              req = urllib.request.Request(f"{os.environ['WP_URL'].rstrip('/')}/wp-json/qpv/v1/kv/qpv-huracanes/{key}", headers={"Authorization": "Basic " + auth, "User-Agent": "QPV-Robot/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return True
              except urllib.error.HTTPError as e:
                  if e.code == 404: return False
                  raise
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          storms = nhc.active_storms()
          if not storms:
              print("Sin ciclones en el Pacífico Este"); out.write("go=false\n"); sys.exit(0)
          for st in storms:
              adv = (st.get("forecastAdvisory") or {}).get("advNum", "")
              key = f"{st['id']}-{adv}".lower()
              info = {"exists": wp_existe(key)}
              print(st["name"], key, info)
              if info.get("exists") and "${{ inputs.force }}" != "true":
                  continue
              out.write(f"go=true\nkey={key}\n"); sys.exit(0)
          out.write("go=false\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        if: steps.check.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r scripts/hurricane-video/requirements.txt

      - name: Generar video con datos del NHC
        if: steps.check.outputs.go == 'true'
        id: gen
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python scripts/hurricane-video/generate.py --live --out out $FORCE
          if [ -f out/SKIP ]; then echo "made=false" >> "$GITHUB_OUTPUT"; else echo "made=true" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar copia del video
        if: steps.gen.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-ciclon
          path: out/
          retention-days: 14

      - uses: actions/setup-node@v4
        if: steps.gen.outputs.made == 'true' && steps.cfg.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Subir a WordPress y publicar en Facebook
        if: steps.gen.outputs.made == 'true' && steps.cfg.outputs.publish == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx tsx scripts/robot/huracan.ts publicar out
