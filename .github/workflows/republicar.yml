# Vuelve a mandar a Facebook una nota ya publicada, con la postal actual (2026-10-31).
name: Republicar nota en Facebook

on:
  workflow_dispatch:
    inputs:
      slug: { description: "Slug de la nota (o el inicio del slug)", required: true }

permissions:
  contents: read

jobs:
  republicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      QPV_SITE_URL: https://quepasavta.com
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/robot/robot.ts republicar "${{ inputs.slug }}"
